[project]
name = "eco-pulse-bot"
version = "5.0"
description = "Bot do Discord do servidor ECO PULSE: vendas por Pix, tickets, verificação, sorteios, automações e conector MCP."
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E402"]
